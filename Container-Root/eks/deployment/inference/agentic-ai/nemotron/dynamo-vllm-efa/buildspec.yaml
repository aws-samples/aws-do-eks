version: 0.2

# =============================================================================
# CodeBuild buildspec for the ONE Nemotron dynamo-vllm-efa image (../super AND ../ultra) - the one project
# builds BOTH recipes of this folder; its DEFAULT (RECIPE unset) is dynamo-vllm-efa:1.5.0-patched.
#
# Author: Anton Alexander
#
# Reproducible build from the PUBLIC base nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0-efa
# (EFA 1.50 + NIXL LIBFABRIC + vLLM 0.28.0 baked). The Dockerfile's two opt-in patch layers are
# switched ON here (DOCKER_BUILD_ARGS), so the published image covers every ../super cell measured
# in RESULTS.md (incl. PP>1 disagg and disagg/epd) and ../ultra's PP>1 shapes - the "-patched"
# semantics of the former 1.4.0-patched ultra image. A bare `docker build` (no args) reproduces the
# ray-only variant instead; see the Dockerfile header for which measured digest carried which cells.
#
# Reuses build-sbom-scan.sh, so the CodeBuild path produces the SAME artifacts as the local path:
# image + syft SBOM (SPDX + CycloneDX) + trivy CVE gate (0 CRITICAL; HIGH <= MAX_HIGH) + the gate PASS record.
# The push (post_build) happens only for an image id that has that PASS record - see post_build.
#
# RECIPE selects which recipe folder the run builds (select-recipe.sh resolves it in every phase):
#   RECIPE unset / empty (THE DEFAULT)  this folder's Dockerfile -> dynamo-vllm-efa:1.5.0-patched, every value below as is
#   RECIPE=1.4.0-patched                the ultra sibling 1.4.0-patched/ (vllm-runtime:1.4.0-efa, vLLM 0.26, PP>1 patch
#                                       always on); its recipe.env REPLACES BASE / IMAGE / DOCKER_BUILD_ARGS with that
#                                       recipe's (REGISTRY, GATE_SEVERITY, MAX_HIGH stay). Set it per build (start-build
#                                       environment override) or on a second project - same buildspec path either way.
#   anything else                       fails the run before the build (no folder, or not a sibling folder name).
# Both recipes write their SBOMs + gate records into THIS folder's sbom/ (the artifacts below), named by image tag.
#
# Project env vars (PLAINTEXT unless noted). REGISTRY / IMAGE (incl. the tag) are the maintainer's
# call; the defaults below follow the 1.x.y-patched line of the ultra image:
#   RECIPE=                 (empty = the 1.5.0 recipe of this folder; 1.4.0-patched = the ultra sibling, see 1.4.0-patched/recipe.env)
#   REGISTRY=public.ecr.aws/hpc-cloud/
#   IMAGE=dynamo-vllm-efa:1.5.0-patched
#   DOCKER_BUILD_ARGS="--build-arg NIXL_PP_PATCH=1 --build-arg DYNAMO_EPD_NEMOTRON_PATCH=1"
#   GATE_SEVERITY=CRITICAL,HIGH
#   MAX_HIGH=10
#   BASE=nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0-efa
#   NGC_API_KEY (SECRETS MANAGER, optional - public -efa tags pull anonymously)
# =============================================================================

env:
  variables:
    # Which recipe folder this run builds. Empty = THIS folder = dynamo-vllm-efa:1.5.0-patched (the default image of the
    # pipeline); "1.4.0-patched" = the ultra sibling, whose recipe.env then replaces BASE / IMAGE / DOCKER_BUILD_ARGS below.
    RECIPE: ""
    BASE: "nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0-efa"
    DOCKER_BUILD_ARGS: "--build-arg NIXL_PP_PATCH=1 --build-arg DYNAMO_EPD_NEMOTRON_PATCH=1"
    GATE_SEVERITY: "CRITICAL,HIGH"
    # measured 5 HIGH on 2026-10-21 with this exact recipe and args and the 2026-10-21T01:19Z trivy DB (0 CRITICAL; all five
    # residual HIGHs ride the deliberate ray 2.55.1 pin: ray itself + its vendored aiohttp 3.13.5 x4 - see the Dockerfile's
    # KNOWN-OPEN note). The first pipeline run (2026-10-21T03:11Z) reported 3 CRITICAL / 12 HIGH on the previous recipe: same
    # tools and package set, newer DB (certifi, pillow, uv advisories published 2026-10-19/20) - answered by steps 4h-4k.
    # Headroom for newly-disclosed CVEs between rebuilds; the GATE SUMMARY names the DB it used. Ratchet it down after each
    # pipeline report, never up without a reason in the log.
    MAX_HIGH: "10"
    REGISTRY: "public.ecr.aws/hpc-cloud/"
    IMAGE: "dynamo-vllm-efa:1.5.0-patched"

phases:
  install:
    commands:
      # syft + trivy (the SBOM + CVE-gate tools build-sbom-scan.sh expects).
      - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - syft version && trivy --version

  pre_build:
    commands:
      - cd "${CODEBUILD_SRC_DIR}/Container-Root/eks/deployment/inference/agentic-ai/nemotron/dynamo-vllm-efa"
      # NGC login ONLY if a key is supplied; public -efa tags pull anonymously.
      - |
        . ./select-recipe.sh
        if [ -n "${NGC_API_KEY:-}" ]; then
          echo "[ngc] logging in to nvcr.io"
          echo "${NGC_API_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
        else
          echo "[ngc] no NGC_API_KEY set - relying on anonymous pull of ${BASE}"
        fi
      - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${REGISTRY}

  build:
    commands:
      # select-recipe.sh: RECIPE unset -> RECIPE_DIR=. and the env above untouched (the default, 1.5.0-patched);
      # RECIPE=1.4.0-patched -> RECIPE_DIR=./1.4.0-patched + that folder's recipe.env. Then
      # build (RECIPE_DIR as the docker context, BASE + DOCKER_BUILD_ARGS forwarded as --build-arg) -> syft SBOM -> trivy CVE gate,
      # with OUTDIR pinned to THIS folder's sbom/ so the artifacts + the PASS record land in one place for either recipe.
      # build-sbom-scan.sh exits NONZERO on any CRITICAL, on HIGH > MAX_HIGH, or on a missing scan,
      # which fails this phase (no false-pass - see the script's fail-loud guard).
      - |
        set -eu
        cd "${CODEBUILD_SRC_DIR}/Container-Root/eks/deployment/inference/agentic-ai/nemotron/dynamo-vllm-efa"
        . ./select-recipe.sh
        CONTEXT="${RECIPE_DIR}" OUTDIR="${PWD}/sbom" REGISTRY="${REGISTRY}" IMAGE="${IMAGE}" BASE="${BASE}" DOCKER_BUILD_ARGS="${DOCKER_BUILD_ARGS}" GATE_SEVERITY="${GATE_SEVERITY}" MAX_HIGH="${MAX_HIGH}" ./build-sbom-scan.sh

  post_build:
    commands:
      # The push is CONDITIONED ON THE GATE, inside ONE command: `docker push` is reachable only through the checks above it.
      # CodeBuild runs post_build even when the build phase failed, and an `exit 0` in one command does not stop the commands
      # after it (2026-10-21T03:11Z: the previous guard printed "NOT pushing" and the separate `docker push` command below it
      # pushed a 3-CRITICAL image anyway). The condition is the gate's own PASS record (sbom/<image>.gate-pass.txt, written by
      # build-sbom-scan.sh ONLY after every check passed, removed at the start of each run) for the exact image id about to be
      # pushed, plus CODEBUILD_BUILD_SUCCEEDING. Any failed check exits nonzero, so a run that did not push is RED, never a
      # quiet success. select-recipe.sh resolves IMAGE for the recipe this run built (RECIPE), as in the build phase.
      - |
        set -eu
        cd "${CODEBUILD_SRC_DIR}/Container-Root/eks/deployment/inference/agentic-ai/nemotron/dynamo-vllm-efa"
        . ./select-recipe.sh
        IMAGE_URI="${REGISTRY}${IMAGE}"
        GATE_PASS="sbom/$(echo "${IMAGE}" | tr '/:' '__').gate-pass.txt"
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != "1" ]; then
          echo "[post_build] build phase FAILED (CODEBUILD_BUILD_SUCCEEDING=${CODEBUILD_BUILD_SUCCEEDING:-unset}) - NOT pushing ${IMAGE_URI}"
          exit 1
        fi
        if [ ! -s "${GATE_PASS}" ]; then
          echo "[post_build] no gate PASS record at ${GATE_PASS} (the gate did not pass, or did not run) - NOT pushing ${IMAGE_URI}"
          exit 1
        fi
        IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE}")"
        if ! grep -qx "image_id=${IMAGE_ID}" "${GATE_PASS}"; then
          echo "[post_build] gate PASS record is not for the image about to be pushed (${IMAGE_ID}) - NOT pushing ${IMAGE_URI}"
          cat "${GATE_PASS}"
          exit 1
        fi
        echo "[post_build] gate PASS record accepted for ${IMAGE_ID}:"
        cat "${GATE_PASS}"
        docker tag "${IMAGE}" "${IMAGE_URI}"
        docker push "${IMAGE_URI}"
        echo "[post_build] pushed ${IMAGE_URI} ($(grep -E '^(critical|high|tooling)=' "${GATE_PASS}" | tr '\n' ';'))"

artifacts:
  # Ship the SBOM + gate summary + gate PASS record as build artifacts (provenance record): SPDX + CycloneDX SBOMs, trivy json + table.
  # Both recipes write here (OUTDIR is pinned in the build phase), the files are named by image tag.
  base-directory: Container-Root/eks/deployment/inference/agentic-ai/nemotron/dynamo-vllm-efa/sbom
  files:
    - "*.json"
    - "*.txt"
