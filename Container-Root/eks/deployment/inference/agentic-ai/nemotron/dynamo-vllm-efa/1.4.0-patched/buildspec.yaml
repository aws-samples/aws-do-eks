version: 0.2

# =============================================================================
# CodeBuild buildspec for the ultra image dynamo-vllm-efa:1.4.0-patched (../../ultra/{agg,disagg}/.env default).
#
# Author: Anton Alexander
#
# Reproducible build from the PUBLIC base nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0-efa
# (EFA 1.49 + NIXL LIBFABRIC + vLLM 0.26.0 baked) through THIS folder's Dockerfile: Ray 2.55.1, the
# 0.26-era NIXL pull-path pipeline-parallel patch layer (PP>1 disaggregation, always on - this
# Dockerfile has no opt-in patch ARGs), the CVE removals and the NVFP4 cubin-dir fix. It is the
# second CodeBuild project of the nemotron/dynamo-vllm-efa folder: the sibling ../buildspec.yaml
# builds the shared 1.5.0 recipe; this one builds the 1.4.0 line that the 550B rows were measured on.
#
# Reuses the SHARED gate ../build-sbom-scan.sh with CONTEXT=. (this folder is the docker build
# context), so this path produces the SAME artifacts as the 1.5.0 one: image + syft SBOM (SPDX +
# CycloneDX) + trivy CVE gate (0 CRITICAL; HIGH <= MAX_HIGH) + the gate PASS record, all under
# this folder's sbom/. The push (post_build) happens only for an image id that has that PASS record.
#
# Project env vars (PLAINTEXT unless noted). REGISTRY / IMAGE (incl. the tag) are the maintainer's
# call; the defaults below are the published ultra image:
#   REGISTRY=public.ecr.aws/hpc-cloud/
#   IMAGE=dynamo-vllm-efa:1.4.0-patched
#   GATE_SEVERITY=CRITICAL,HIGH
#   MAX_HIGH=10
#   BASE=nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0-efa
#   NGC_API_KEY (SECRETS MANAGER, optional - public -efa tags pull anonymously)
# =============================================================================

env:
  variables:
    BASE: "nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0-efa"
    GATE_SEVERITY: "CRITICAL,HIGH"
    # Same ceiling as the 1.5.0 recipe. The GATE SUMMARY names the trivy DB it matched against; the measured
    # CRITICAL / HIGH counts of this recipe under a named DB are in README.md. Ratchet it down after each
    # pipeline report, never up without a reason in the log.
    MAX_HIGH: "10"
    REGISTRY: "public.ecr.aws/hpc-cloud/"
    IMAGE: "dynamo-vllm-efa:1.4.0-patched"

phases:
  install:
    commands:
      # syft + trivy (the SBOM + CVE-gate tools build-sbom-scan.sh expects).
      - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - syft version && trivy --version

  pre_build:
    commands:
      - cd "${CODEBUILD_SRC_DIR}/Container-Root/eks/deployment/inference/agentic-ai/nemotron/dynamo-vllm-efa/1.4.0-patched"
      # NGC login ONLY if a key is supplied; public -efa tags pull anonymously.
      - |
        if [ -n "${NGC_API_KEY:-}" ]; then
          echo "[ngc] logging in to nvcr.io"
          echo "${NGC_API_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
        else
          echo "[ngc] no NGC_API_KEY set - relying on anonymous pull of ${BASE}"
        fi
      - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${REGISTRY}

  build:
    commands:
      - cd "${CODEBUILD_SRC_DIR}/Container-Root/eks/deployment/inference/agentic-ai/nemotron/dynamo-vllm-efa/1.4.0-patched"
      # build (this folder as the context, BASE forwarded as --build-arg) -> syft SBOM -> trivy CVE gate, through the shared script.
      # build-sbom-scan.sh exits NONZERO on any CRITICAL, on HIGH > MAX_HIGH, or on a missing scan,
      # which fails this phase (no false-pass - see the script's fail-loud guard).
      - CONTEXT=. REGISTRY="${REGISTRY}" IMAGE="${IMAGE}" BASE="${BASE}" GATE_SEVERITY="${GATE_SEVERITY}" MAX_HIGH="${MAX_HIGH}" ../build-sbom-scan.sh

  post_build:
    commands:
      # The push is CONDITIONED ON THE GATE, inside ONE command: `docker push` is reachable only through the checks above it.
      # CodeBuild runs post_build even when the build phase failed, and an `exit 0` in one command does not stop the commands
      # after it (the folder's former buildspec had exactly that hole: a separate `exit 0` guard, then docker tag/push). The
      # condition is the gate's own PASS record (sbom/<image>.gate-pass.txt, written by build-sbom-scan.sh ONLY after every check
      # passed, removed at the start of each run) for the exact image id about to be pushed, plus CODEBUILD_BUILD_SUCCEEDING.
      # Any failed check exits nonzero, so a run that did not push is RED, never a quiet success.
      - |
        set -eu
        cd "${CODEBUILD_SRC_DIR}/Container-Root/eks/deployment/inference/agentic-ai/nemotron/dynamo-vllm-efa/1.4.0-patched"
        IMAGE_URI="${REGISTRY}${IMAGE}"
        GATE_PASS="sbom/$(echo "${IMAGE}" | tr '/:' '__').gate-pass.txt"
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != "1" ]; then
          echo "[post_build] build phase FAILED (CODEBUILD_BUILD_SUCCEEDING=${CODEBUILD_BUILD_SUCCEEDING:-unset}) - NOT pushing ${IMAGE_URI}"
          exit 1
        fi
        if [ ! -s "${GATE_PASS}" ]; then
          echo "[post_build] no gate PASS record at ${GATE_PASS} (the gate did not pass, or did not run) - NOT pushing ${IMAGE_URI}"
          exit 1
        fi
        IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE}")"
        if ! grep -qx "image_id=${IMAGE_ID}" "${GATE_PASS}"; then
          echo "[post_build] gate PASS record is not for the image about to be pushed (${IMAGE_ID}) - NOT pushing ${IMAGE_URI}"
          cat "${GATE_PASS}"
          exit 1
        fi
        echo "[post_build] gate PASS record accepted for ${IMAGE_ID}:"
        cat "${GATE_PASS}"
        docker tag "${IMAGE}" "${IMAGE_URI}"
        docker push "${IMAGE_URI}"
        echo "[post_build] pushed ${IMAGE_URI} ($(grep -E '^(critical|high|tooling)=' "${GATE_PASS}" | tr '\n' ';'))"

artifacts:
  # Ship the SBOM + gate summary + gate PASS record as build artifacts (provenance record): SPDX + CycloneDX SBOMs, trivy json + table.
  base-directory: Container-Root/eks/deployment/inference/agentic-ai/nemotron/dynamo-vllm-efa/1.4.0-patched/sbom
  files:
    - "*.json"
    - "*.txt"
